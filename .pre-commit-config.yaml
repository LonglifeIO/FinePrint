# pre-commit install   (installs both the pre-commit and pre-push hooks below)
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbidden-files
        name: no keystores, local.properties, .env, pipeline/raw or pipeline/drafts
        language: fail
        entry: "never commit this file (see CLAUDE.md, Do not)"
        files: '(\.jks|\.keystore)$|(^|/)local\.properties$|(^|/)\.env$|^pipeline/(raw|drafts)/'

      - id: private-strings
        name: no local paths, Tailscale addresses or private strings
        language: python
        entry: python3 tools/check_private.py
        types: [text]
        exclude: '^(LICENSE|tools/check_private\.py)$'
