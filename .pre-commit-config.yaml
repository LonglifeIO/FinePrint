# pre-commit install   (installs both the pre-commit and pre-push hooks below)
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbidden-files
        name: no keystores, local.properties, .env, databases, pipeline/raw, pipeline/drafts, the watcher's copies or ingest
        language: fail
        entry: "never commit this file (see CLAUDE.md, Do not)"
        files: '(\.jks|\.keystore)$|(^|/)local\.properties$|(^|/)\.env$|(?i:\.(db|sqlite3?))$|^pipeline/(raw|drafts)/|^pipeline/watch/(snapshots|queue|acked|digest)/|^pipeline/watch/local\.json$|^ingest(/|$)'
        types: []                  # the default, [file], would skip ingest, which is a symlink
        types_or: [file, symlink]

      - id: private-strings
        name: no local paths, Tailscale addresses or private strings
        language: python
        entry: python3 tools/check_private.py
        types: [text]
        exclude: '^(LICENSE|tools/check_private\.py)$'
