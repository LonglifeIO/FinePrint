# Pipeline tests, schema validation of pipeline/reviewed/*.json, and a debug build of the app.
# Actions are pinned to commit SHAs; the comment after each is the release it came from. The runner is
# pinned too (ubuntu-24.04, not ubuntu-latest), so a new Ubuntu image never changes the build unasked;
# moving to a newer one is its own change.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests and record validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install requests and jsonschema (the pipeline's only dependencies)
        run: python -m pip install --disable-pip-version-check requests==2.32.5 jsonschema==4.25.1
      - name: Pipeline tests
        run: python -m unittest discover -s pipeline -p 'test_*.py' -v
      # build.py merges the reviewed records, validates them against bundle/schema.json and cross-checks
      # company, source and tracker ids. Source URLs are checked on the Mac at build time instead:
      # several sites refuse data-centre addresses, and the check fetches every page each time.
      - name: Validate reviewed records against bundle/schema.json
        run: python pipeline/build.py --skip-url-check --out "$RUNNER_TEMP/bundle-preview.json"

  android:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the Android 17 (API 37) platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Both debug flavours: the app (device) and the preview.
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace
      # The preview build (README, Preview build): sample apps and a bundle built in, no scan and no network. Kept as
      # this run's artifact for 30 days, to download from the Actions page and sideload; never attached to a release.
      - name: Preview APK
        working-directory: android
        run: ./gradlew assemblePreviewDebug --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fineprint-preview
          path: android/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          retention-days: 30
          if-no-files-found: error
      # The device flavour's full suite and the preview's own tests (PreviewTest). Includes PaletteContrastTest: text
      # contrast, and no two chip colours collapsing for a red-green colour-blind reader.
      - name: JVM unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace
      # docs/METHOD.md, Voice: the readability reports the JVM tests wrote (ReadabilityReport), over the app's strings and
      # the bundle's text people read. Printed in full here, with each report's count as a warning: never a gate.
      - name: Readability report (a warning, never a gate)
        if: always()
        continue-on-error: true
        working-directory: android
        run: |
          for r in app bundle; do
            f="app/build/reports/readability/$r.txt"
            [ -f "$f" ] || continue
            cat "$f"
            echo "::warning title=Readability ($r)::$(sed -n 2p "$f")"
          done
      # Debug builds may carry Compose's preview tooling; the release runtime classpath must not (CLAUDE.md). Nor may
      # the release build hold any of the preview flavour: its classes, assets or manifest.
      - name: No Compose tooling or preview code in the release build
        working-directory: android
        run: ./gradlew checkReleaseClasspath --stacktrace
