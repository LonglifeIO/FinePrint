org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Device tests leave FinePrint installed: uninstalling it after a run would delete its data on the test
# emulator (Reviewed marks, the cached bundle, the debug-only network grant). Only the test APK goes
# afterwards (uninstallDebugAndroidTest, in app/build.gradle.kts), so it isn't listed as one of the apps.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# Lint from AGP 9.5.0-rc01 (lint 32.5.0-rc01), while AGP itself stays on 9.4.1, the latest stable. 9.4.1's lint crashes
# analysing build.gradle.kts in the release build (lintVitalAnalyzeDeviceRelease: "findFirCompiledSymbol only works on
# compiled declarations"), and from AGP 9.3 its K2 analysis can't be turned off. Drop this line with AGP 9.5.0.
android.experimental.lint.version=9.5.0-rc01
